name: 🚀 Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload backend files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "app.js,utils.js,package.json,src,scripts"
          target: /var/www/tokshop-backend
          overwrite: true

      - name: Restart backend
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOYED_COMMIT: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          envs: DEPLOYED_COMMIT
          script: |
            set -e
            cd /var/www/tokshop-backend
            npm install --production
            pm2 restart app
            echo "$DEPLOYED_COMMIT" > .deployed-commit
            echo "Deployed commit: $DEPLOYED_COMMIT"
