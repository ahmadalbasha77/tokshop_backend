<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — {{app_name}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: {{primary_color}};
      --primary-hover: {{primary_color}}dd;
      --bg: #0f0f11;
      --surface: #1a1a1f;
      --surface-2: #24242b;
      --border: #2e2e38;
      --text: #f0f0f2;
      --text-muted: #8a8a9a;
      --success: #22c55e;
      --success-bg: #22c55e18;
      --error: #ef4444;
      --error-bg: #ef444418;
      --radius: 12px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, {{primary_color}}15, transparent),
        radial-gradient(ellipse 60% 40% at 50% 120%, {{primary_color}}10, transparent);
    }

    .container {
      width: 100%;
      max-width: 440px;
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-area {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-area img {
      height: 48px;
      margin-bottom: 8px;
      border-radius: 10px;
    }

    .logo-area h2 {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .card h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .card p.subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 18px;
      height: 18px;
      pointer-events: none;
    }

    .field input {
      width: 100%;
      padding: 12px 14px 12px 44px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px {{primary_color}}25;
    }

    .field input::placeholder {
      color: var(--text-muted);
    }

    .toggle-pass {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      transition: color 0.2s;
    }

    .toggle-pass:hover {
      color: var(--text);
    }

    .strength {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }

    .strength-bar {
      height: 3px;
      flex: 1;
      border-radius: 2px;
      background: var(--border);
      transition: background 0.3s;
    }

    .strength-bar.active.weak { background: #ef4444; }
    .strength-bar.active.medium { background: #f59e0b; }
    .strength-bar.active.strong { background: #22c55e; }

    .strength-text {
      font-size: 11px;
      margin-top: 4px;
      color: var(--text-muted);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px {{primary_color}}40;
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .alert {
      padding: 14px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      line-height: 1.5;
      display: none;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }

    .alert svg {
      flex-shrink: 0;
      margin-top: 1px;
    }

    .alert.show { display: flex; }

    .alert-error {
      background: var(--error-bg);
      border: 1px solid #ef444430;
      color: #fca5a5;
    }

    .alert-success {
      background: var(--success-bg);
      border: 1px solid #22c55e30;
      color: #86efac;
    }

    /* Success state */
    .success-state {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .success-state.show { display: block; }

    .success-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--success-bg);
      border: 2px solid #22c55e30;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      animation: popIn 0.4s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0); }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .success-icon svg {
      color: var(--success);
      width: 36px;
      height: 36px;
    }

    .success-state h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .success-state p {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
    }

    /* Expired / Invalid token state */
    .form-state { display: block; }
    .form-state.hide { display: none; }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .footer a {
      color: var(--primary);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .card { padding: 28px 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-area">
      <img src="{{app_logo}}" alt="{{app_name}}" onerror="this.style.display='none'" />
      <h2>{{app_name}}</h2>
    </div>

    <div class="card">
      <!-- Error / Info Alert -->
      <div class="alert alert-error" id="alertError">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
        <span id="alertErrorText"></span>
      </div>

      <!-- Form State -->
      <div class="form-state" id="formState">
        <h1>Reset Password</h1>
        <p class="subtitle">Enter your new password below. Make sure it's at least 6 characters.</p>

        <form id="resetForm" onsubmit="handleSubmit(event)">
          <div class="field">
            <label for="password">New Password</label>
            <div class="input-wrapper">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input type="password" id="password" placeholder="Enter new password" required minlength="6" autocomplete="new-password" />
              <button type="button" class="toggle-pass" onclick="togglePassword('password', this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <div class="strength" id="strengthBars">
              <div class="strength-bar"></div>
              <div class="strength-bar"></div>
              <div class="strength-bar"></div>
              <div class="strength-bar"></div>
            </div>
            <div class="strength-text" id="strengthText"></div>
          </div>

          <div class="field">
            <label for="confirmPassword">Confirm Password</label>
            <div class="input-wrapper">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
              <input type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="6" autocomplete="new-password" />
              <button type="button" class="toggle-pass" onclick="togglePassword('confirmPassword', this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" id="submitBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            Reset Password
          </button>
        </form>
      </div>

      <!-- Success State -->
      <div class="success-state" id="successState">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <h2>Password Reset Successfully!</h2>
        <p>Your password has been changed. You can now open the app and log in with your new password.</p>
      </div>
    </div>

    <div class="footer">
      Secured by <a href="#">{{app_name}}</a>
    </div>
  </div>

  <script>
    const token = new URLSearchParams(window.location.search).get('token');

    if (!token) {
      showError('Invalid reset link. No token was provided.');
      document.getElementById('resetForm').style.display = 'none';
    }

    // Password strength checker
    document.getElementById('password').addEventListener('input', function () {
      const val = this.value;
      const bars = document.querySelectorAll('.strength-bar');
      const text = document.getElementById('strengthText');
      let score = 0;

      if (val.length >= 6) score++;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
      if (/[0-9]/.test(val) && /[^A-Za-z0-9]/.test(val)) score++;

      const levels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
      const classes = ['', 'weak', 'medium', 'medium', 'strong'];

      bars.forEach((bar, i) => {
        bar.className = 'strength-bar';
        if (i < score) {
          bar.classList.add('active', classes[score]);
        }
      });

      text.textContent = val.length > 0 ? levels[score] : '';
    });

    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.innerHTML = isPassword
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
        : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    }

    function showError(msg) {
      const el = document.getElementById('alertError');
      document.getElementById('alertErrorText').textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 6000);
    }

    async function handleSubmit(e) {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('submitBtn');

      // Validation
      if (password.length < 6) {
        return showError('Password must be at least 6 characters.');
      }

      if (password !== confirmPassword) {
        return showError('Passwords do not match.');
      }

      // Submit
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Resetting...';

      try {
        const res = await fetch('/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.message || 'Failed to reset password');
        }

        // Show success
        document.getElementById('formState').classList.add('hide');
        document.getElementById('successState').classList.add('show');
      } catch (err) {
        showError(err.message);
        btn.disabled = false;
        btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Reset Password';
      }
    }
  </script>
</body>
</html>
